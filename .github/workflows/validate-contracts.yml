name: Validate contracts and plugin

on:
  pull_request:
    paths:
      - "README.md"
      - "docs/**"
      - "contracts/**"
      - "shared/brand/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-contracts.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "docs/**"
      - "contracts/**"
      - "shared/brand/**"
      - "skills/**"
      - ".claude-plugin/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-contracts.yml"

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_contracts.py
      - run: python scripts/validate_plugin.py
      - run: python -m unittest discover -s tests -v
